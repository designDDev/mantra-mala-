<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#080808"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>Mantra Mala – Japa Counter</title>
<link rel="manifest" href="manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700;900&family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#080808;color:#fff;font-family:'Poppins',sans-serif;overflow-x:hidden;}
#root{min-height:100vh;}
@keyframes rippleOut{to{width:320px;height:320px;opacity:0;}}
@keyframes flashBg{0%,100%{opacity:0}40%{opacity:0.65}}
@keyframes slideUp{from{transform:translateY(22px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes milestoneAnim{0%{transform:translateY(0) scale(0.7);opacity:0}25%{transform:translateY(-18px) scale(1.2);opacity:1}85%{opacity:1}100%{transform:translateY(-60px) scale(0.95);opacity:0}}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:#111}::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:2px}
input[type=number]::-webkit-inner-spin-button{opacity:1}
input{font-family:'Poppins',sans-serif;}
button{font-family:'Poppins',sans-serif;cursor:pointer;}
.screen{animation:fadeIn 0.28s ease;}
.profile-card{border-radius:16px;padding:13px 15px;margin-bottom:9px;cursor:pointer;position:relative;overflow:hidden;transition:transform 0.12s,border-color 0.18s;}
.profile-card:active{transform:scale(0.98)!important;}
.tap-btn:active{transform:scale(0.92)!important;}
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useRef } = React;

const PRESET_PROFILES = [
  { id:1, name:"Om Namah Shivaya",  mantra:"ॐ नमः शिवाय",        target:108, color:"#FF6B35", bg:"#1a0a00", accent:"#FF8C42", emoji:"🔱" },
  { id:2, name:"Hare Krishna",       mantra:"हरे कृष्ण हरे राम",  target:108, color:"#4ECDC4", bg:"#001a18", accent:"#6EDDD6", emoji:"🪈" },
  { id:3, name:"Om Mani Padme Hum",  mantra:"ॐ मणि पद्मे हूँ",   target:21,  color:"#FFD93D", bg:"#1a1500", accent:"#FFE566", emoji:"☸️" },
  { id:4, name:"Gayatri Mantra",     mantra:"ॐ भूर्भुवः स्वः",   target:108, color:"#C084FC", bg:"#0d0015", accent:"#D8A5FF", emoji:"🌞" },
  { id:5, name:"Allah hu Akbar",     mantra:"اللَّهُ أَكْبَرُ",  target:33,  color:"#34D399", bg:"#001a0d", accent:"#5CE4B0", emoji:"☪️" },
];
const MAX_CUSTOM = 10;
const SWATCHES = ["#FF6B35","#FF2D55","#F472B6","#C084FC","#818CF8","#60A5FA","#4ECDC4","#34D399","#FFD93D","#FB923C"];

function colorToBg(hex){
  try{const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.floor(r*.11)},${Math.floor(g*.11)},${Math.floor(b*.11)})`;}catch{return "#0d0d0d";}
}
function lighten(hex,amt=45){
  try{const r=Math.min(255,parseInt(hex.slice(1,3),16)+amt),g=Math.min(255,parseInt(hex.slice(3,5),16)+amt),b=Math.min(255,parseInt(hex.slice(5,7),16)+amt);
  return `#${r.toString(16).padStart(2,"0")}${g.toString(16).padStart(2,"0")}${b.toString(16).padStart(2,"0")}`;}catch{return hex;}
}
function makeBlank(id){
  const c=SWATCHES[(id*3)%SWATCHES.length];
  return{id,name:"",mantra:"",target:108,color:c,bg:colorToBg(c),accent:lighten(c),emoji:"✨",isCustom:true};
}
function spawnRipple(x,y,color){
  const el=document.createElement("div");
  el.style.cssText=`position:fixed;left:${x}px;top:${y}px;width:0;height:0;border-radius:50%;background:${color}44;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);animation:rippleOut .55s ease-out forwards;`;
  document.body.appendChild(el);setTimeout(()=>el.remove(),600);
}

function ProfileCard({p,pKey,count,rounds,pct,onTap,onEdit,onDelete,showDelete,idx}){
  return(
    <div className="profile-card" onClick={onTap}
      style={{background:`${p.bg}ee`,border:`1.5px solid ${p.color}22`,animationName:"slideUp",animationDuration:"0.28s",animationTimingFunction:"ease",animationFillMode:"both",animationDelay:`${idx*0.04}s`}}>
      <div style={{position:"absolute",left:0,top:0,height:"100%",width:`${pct}%`,background:`${p.color}12`,borderRadius:16,pointerEvents:"none",transition:"width .4s ease"}}/>
      <div style={{display:"flex",alignItems:"center",gap:12,position:"relative"}}>
        <div style={{fontSize:24,flexShrink:0}}>{p.emoji}</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:700,fontSize:13,color:p.color,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name||<span style={{color:"#444",fontStyle:"italic"}}>Unnamed</span>}</div>
          <div style={{fontSize:11,color:"#666",fontFamily:"Noto Serif,serif",marginTop:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.mantra||"—"}</div>
          <div style={{display:"flex",gap:10,marginTop:5}}>
            <span style={{fontSize:10,color:"#444"}}>Count <span style={{color:p.accent,fontWeight:600}}>{count}/{p.target}</span></span>
            <span style={{fontSize:10,color:"#444"}}>Rounds <span style={{color:p.accent,fontWeight:600}}>{rounds}</span></span>
          </div>
        </div>
        <div style={{display:"flex",gap:6,flexShrink:0}}>
          <button onClick={onEdit} style={{background:"#ffffff08",border:"1px solid #1e1e1e",borderRadius:8,color:"#555",padding:"5px 11px",fontSize:11,fontWeight:500,transition:"all .15s"}}>Edit</button>
          {showDelete&&<button onClick={onDelete} style={{background:"none",border:"1px solid #1e1e1e",borderRadius:8,color:"#442222",padding:"5px 9px",fontSize:13,transition:"all .15s"}}>🗑</button>}
        </div>
      </div>
      <div style={{marginTop:9,height:2,background:"#1a1a1a",borderRadius:2,overflow:"hidden"}}>
        <div style={{height:"100%",width:`${pct}%`,background:`linear-gradient(90deg,${p.color},${p.accent})`,borderRadius:2,transition:"width .5s ease"}}/>
      </div>
    </div>
  );
}

function App(){
  const [screen,setScreen]=useState("home");
  const [customs,setCustoms]=useState([]);
  const [activeId,setActiveId]=useState(null);
  const [counts,setCounts]=useState({});
  const [rounds,setRounds]=useState({});
  const [editForm,setEditForm]=useState(null);
  const [flash,setFlash]=useState(false);
  const [milestone,setMilestone]=useState(null);
  const lastTap=useRef(0);
  const nextId=useRef(101);

  const allProfiles=[
    ...PRESET_PROFILES.map(p=>({...p,_key:`preset-${p.id}`,_src:"preset"})),
    ...customs.map(p=>({...p,_key:`custom-${p.id}`,_src:"custom"})),
  ];
  const active=allProfiles.find(p=>p._key===activeId);
  const count=counts[activeId]||0;
  const round=rounds[activeId]||0;
  const target=active?.target||108;
  const progress=Math.min((count/target)*100,100);

  function doCount(x,y){
    if(!active)return;
    spawnRipple(x,y,active.color);
    setCounts(prev=>{
      const cur=(prev[activeId]||0)+1;
      if(cur>=active.target){
        setFlash(true);setMilestone("🎉 Round Complete!");
        setTimeout(()=>setFlash(false),700);setTimeout(()=>setMilestone(null),2000);
        setRounds(r=>({...r,[activeId]:(r[activeId]||0)+1}));
        return{...prev,[activeId]:0};
      }
      if(cur%10===0){setMilestone(`✨ ${cur}`);setTimeout(()=>setMilestone(null),900);}
      return{...prev,[activeId]:cur};
    });
  }

  function handleTouchEnd(e){
    e.preventDefault();
    const now=Date.now();if(now-lastTap.current<80)return;lastTap.current=now;
    const t=e.changedTouches[0];doCount(t.clientX,t.clientY);
  }
  function handleMouseClick(e){
    const now=Date.now();if(now-lastTap.current<80)return;lastTap.current=now;doCount(e.clientX,e.clientY);
  }
  function handleReset(){setCounts(p=>({...p,[activeId]:0}));setMilestone("↺ Reset");setTimeout(()=>setMilestone(null),800);}

  function openEdit(profile,e){e?.stopPropagation();setEditForm({...profile});setScreen("editProfile");}
  function updColor(hex){setEditForm(f=>({...f,color:hex,accent:lighten(hex),bg:colorToBg(hex)}));}
  function saveEdit(){
    const parsed={...editForm,target:Math.max(1,parseInt(editForm.target)||108),accent:lighten(editForm.color),bg:colorToBg(editForm.color)};
    if(parsed._src==="custom")setCustoms(cs=>cs.map(c=>c.id===parsed.id?parsed:c));
    setScreen("home");
  }
  function addCustom(){
    if(customs.length>=MAX_CUSTOM)return;
    const id=nextId.current++;const blank=makeBlank(id);
    setCustoms(cs=>[...cs,blank]);setEditForm({...blank,_src:"custom"});setScreen("editProfile");
  }
  function delCustom(id,e){
    e?.stopPropagation();setCustoms(cs=>cs.filter(c=>c.id!==id));
    const key=`custom-${id}`;
    setCounts(c=>{const n={...c};delete n[key];return n;});
    setRounds(r=>{const n={...r};delete n[key];return n;});
    if(activeId===key)setActiveId(null);
  }

  const canAdd=customs.length<MAX_CUSTOM;

  // ── HOME ──
  if(screen==="home") return(
    <div className="screen">
      <div style={{padding:"28px 20px 0",textAlign:"center"}}>
        <div style={{fontSize:10,letterSpacing:5,color:"#444",textTransform:"uppercase",fontWeight:300}}>Japa Counter</div>
        <h1 style={{fontSize:28,fontWeight:900,marginTop:4,background:"linear-gradient(120deg,#fff 30%,#666)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>Mantra Mala</h1>
      </div>
      <div style={{padding:"14px 14px 100px"}}>
        <div style={{fontSize:9,letterSpacing:3,color:"#3a3a3a",textTransform:"uppercase",marginBottom:10,paddingLeft:4}}>Preset Profiles</div>
        {PRESET_PROFILES.map((p,i)=>{
          const key=`preset-${p.id}`,c=counts[key]||0,r=rounds[key]||0,pct=Math.min((c/p.target)*100,100);
          return<ProfileCard key={key} p={p} pKey={key} count={c} rounds={r} pct={pct} idx={i}
            onTap={()=>{setActiveId(key);setScreen("counter");}}
            onEdit={e=>openEdit({...p,_src:"preset"},e)} showDelete={false}/>;
        })}

        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",margin:"20px 0 10px",paddingLeft:4,paddingRight:4}}>
          <div style={{fontSize:9,letterSpacing:3,color:"#3a3a3a",textTransform:"uppercase"}}>Custom Profiles ({customs.length}/{MAX_CUSTOM})</div>
          {canAdd
            ?<button onClick={addCustom} style={{background:"linear-gradient(135deg,#3a3a3a,#222)",border:"1px solid #333",borderRadius:10,color:"#ccc",padding:"6px 14px",fontSize:11,fontWeight:600,display:"flex",alignItems:"center",gap:6}}>
              <span style={{fontSize:16,lineHeight:1}}>+</span> Add Custom
            </button>
            :<span style={{fontSize:10,color:"#555",fontStyle:"italic"}}>Max {MAX_CUSTOM} reached</span>
          }
        </div>

        {customs.length===0
          ?<div onClick={addCustom} style={{border:"1.5px dashed #222",borderRadius:16,padding:"22px 16px",textAlign:"center",cursor:"pointer"}}>
            <div style={{fontSize:28,marginBottom:8}}>✨</div>
            <div style={{fontSize:13,color:"#555",fontWeight:500}}>Create your first custom profile</div>
            <div style={{fontSize:11,color:"#333",marginTop:4}}>Up to 10 custom mantras</div>
          </div>
          :customs.map((p,i)=>{
            const key=`custom-${p.id}`,c=counts[key]||0,r=rounds[key]||0,pct=Math.min((c/p.target)*100,100);
            return<ProfileCard key={key} p={p} pKey={key} count={c} rounds={r} pct={pct} idx={i}
              onTap={()=>{setActiveId(key);setScreen("counter");}}
              onEdit={e=>openEdit({...p,_src:"custom"},e)}
              onDelete={e=>delCustom(p.id,e)} showDelete={true}/>;
          })
        }
        {customs.length>0&&canAdd&&
          <button onClick={addCustom} style={{width:"100%",marginTop:8,padding:"13px",background:"#0f0f0f",border:"1.5px dashed #222",borderRadius:14,color:"#444",fontSize:12,fontWeight:500,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
            <span style={{fontSize:18,lineHeight:1}}>+</span> Add Another ({MAX_CUSTOM-customs.length} remaining)
          </button>
        }
      </div>
    </div>
  );

  // ── COUNTER ──
  if(screen==="counter"&&active) return(
    <div className="screen" style={{minHeight:"100vh",background:active.bg,display:"flex",flexDirection:"column"}}>
      {flash&&<div style={{position:"fixed",inset:0,background:active.color,zIndex:200,animation:"flashBg .7s ease forwards",pointerEvents:"none"}}/>}
      {milestone&&<div style={{position:"fixed",top:"30%",left:"50%",transform:"translateX(-50%)",fontSize:22,fontWeight:800,color:active.color,zIndex:300,animation:"milestoneAnim 1.6s ease forwards",pointerEvents:"none",whiteSpace:"nowrap",textShadow:`0 0 20px ${active.color}`}}>{milestone}</div>}

      <div style={{display:"flex",alignItems:"center",padding:"16px 18px",borderBottom:`1px solid ${active.color}20`}}>
        <button onClick={()=>setScreen("home")} style={{background:"none",border:"none",color:"#777",fontSize:26,paddingRight:14,lineHeight:1}}>‹</button>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:700,fontSize:14,color:active.color,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{active.emoji} {active.name||"Custom Profile"}</div>
          <div style={{fontSize:11,color:"#666",fontFamily:"Noto Serif,serif",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{active.mantra||"—"}</div>
        </div>
        <div style={{textAlign:"right",flexShrink:0}}>
          <div style={{fontSize:9,color:"#444",letterSpacing:1.5,textTransform:"uppercase"}}>Rounds</div>
          <div style={{fontSize:24,fontWeight:900,color:active.accent}}>{round}</div>
        </div>
      </div>

      <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"16px 20px",gap:28}}>
        <div style={{position:"relative",width:230,height:230}}>
          <svg width="230" height="230" style={{position:"absolute",inset:0,transform:"rotate(-90deg)"}}>
            <circle cx="115" cy="115" r="103" fill="none" stroke={`${active.color}18`} strokeWidth="7"/>
            <circle cx="115" cy="115" r="103" fill="none" stroke={active.color} strokeWidth="7" strokeLinecap="round"
              strokeDasharray={`${2*Math.PI*103}`}
              strokeDashoffset={`${2*Math.PI*103*(1-progress/100)}`}
              style={{transition:"stroke-dashoffset .35s ease",filter:`drop-shadow(0 0 10px ${active.color})`}}/>
          </svg>
          <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
            <div style={{fontSize:68,fontWeight:900,lineHeight:1,color:"#fff",textShadow:`0 0 36px ${active.color}99`}}>{count}</div>
            <div style={{fontSize:13,color:"#555",marginTop:4}}>of {target}</div>
            <div style={{fontSize:11,color:active.color,marginTop:6,letterSpacing:2,fontWeight:600}}>{Math.round(progress)}%</div>
          </div>
        </div>

        <button className="tap-btn"
          onClick={handleMouseClick} onTouchEnd={handleTouchEnd}
          onTouchStart={e=>e.currentTarget.style.transform="scale(0.92)"}
          onMouseDown={e=>e.currentTarget.style.transform="scale(0.92)"}
          onMouseUp={e=>e.currentTarget.style.transform="scale(1)"}
          style={{width:158,height:158,borderRadius:"50%",background:`radial-gradient(circle at 38% 32%,${active.accent},${active.color} 72%)`,border:"none",boxShadow:`0 0 52px ${active.color}55,0 14px 40px rgba(0,0,0,.6)`,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:5,touchAction:"manipulation",transition:"transform .1s ease"}}>
          <div style={{fontSize:28,pointerEvents:"none"}}>{active.emoji}</div>
          <div style={{fontSize:10,letterSpacing:3,color:"#ffffffcc",fontWeight:700,pointerEvents:"none"}}>TAP</div>
        </button>

        <div style={{fontSize:11,color:"#2e2e2e",letterSpacing:1}}>{target-count} left in this round</div>
      </div>

      <div style={{display:"flex",gap:10,padding:"12px 18px 40px"}}>
        <button onClick={handleReset} style={{flex:1,padding:14,background:"#ffffff07",border:"1px solid #222",borderRadius:13,color:"#555",fontSize:12,fontWeight:500}}>Reset Count</button>
        <button onClick={()=>{setRounds(r=>({...r,[activeId]:0}));setCounts(c=>({...c,[activeId]:0}));setMilestone("↺ All Reset");setTimeout(()=>setMilestone(null),900);}} style={{flex:1,padding:14,background:"#ffffff07",border:"1px solid #222",borderRadius:13,color:"#555",fontSize:12,fontWeight:500}}>Reset All</button>
      </div>
    </div>
  );

  // ── EDIT PROFILE ──
  if(screen==="editProfile"&&editForm) return(
    <div className="screen" style={{minHeight:"100vh",background:"#0a0a0a"}}>
      <div style={{display:"flex",alignItems:"center",padding:"16px 18px",borderBottom:"1px solid #181818",position:"sticky",top:0,background:"#0a0a0a",zIndex:10}}>
        <button onClick={()=>{if(editForm._src==="custom"&&!editForm.name)setCustoms(cs=>cs.filter(c=>c.id!==editForm.id));setScreen("home");}} style={{background:"none",border:"none",color:"#666",fontSize:26,paddingRight:12,lineHeight:1}}>‹</button>
        <h2 style={{fontWeight:700,fontSize:16,flex:1}}>{editForm._src==="custom"?(editForm.name?"Edit Custom":"New Custom Profile"):"Edit Preset"}</h2>
        <div style={{width:26,height:26,borderRadius:"50%",background:editForm.color,boxShadow:`0 0 14px ${editForm.color}`}}/>
      </div>

      <div style={{padding:"18px 18px 80px"}}>
        {[{label:"Profile Name",key:"name",type:"text",ph:"e.g. Om Namah Shivaya"},
          {label:"Mantra / Subtitle",key:"mantra",type:"text",ph:"Sanskrit or any language"},
          {label:"Target Count",key:"target",type:"number",ph:"108"},
          {label:"Emoji Icon",key:"emoji",type:"text",ph:"🔱"}
        ].map(({label,key,type,ph})=>(
          <div key={key} style={{marginBottom:16}}>
            <label style={{display:"block",fontSize:9.5,color:"#444",letterSpacing:2.5,textTransform:"uppercase",marginBottom:6}}>{label}</label>
            <input type={type} value={editForm[key]} placeholder={ph}
              onChange={e=>setEditForm(f=>({...f,[key]:e.target.value}))}
              style={{width:"100%",background:"#141414",border:"1.5px solid #1f1f1f",borderRadius:10,padding:"11px 14px",color:"#fff",fontSize:14,outline:"none"}}
              onFocus={e=>e.currentTarget.style.borderColor=editForm.color}
              onBlur={e=>e.currentTarget.style.borderColor="#1f1f1f"}/>
          </div>
        ))}

        <div style={{marginBottom:12}}>
          <label style={{display:"block",fontSize:9.5,color:"#444",letterSpacing:2.5,textTransform:"uppercase",marginBottom:6}}>Theme Color</label>
          <div style={{display:"flex",gap:10,alignItems:"center"}}>
            <input type="text" value={editForm.color} maxLength={7} placeholder="#FF6B35"
              onChange={e=>{if(/^#[0-9a-fA-F]{0,6}$/.test(e.target.value))updColor(e.target.value);}}
              style={{flex:1,background:"#141414",border:"1.5px solid #1f1f1f",borderRadius:10,padding:"11px 14px",color:"#fff",fontSize:14,fontFamily:"monospace",outline:"none"}}
              onFocus={e=>e.currentTarget.style.borderColor=editForm.color}
              onBlur={e=>e.currentTarget.style.borderColor="#1f1f1f"}/>
            <input type="color" value={editForm.color} onChange={e=>updColor(e.target.value)}
              style={{width:44,height:44,padding:3,border:"none",borderRadius:10,cursor:"pointer",background:"#141414"}}/>
          </div>
        </div>

        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:22}}>
          {SWATCHES.map(c=>(
            <div key={c} onClick={()=>updColor(c)}
              style={{width:34,height:34,borderRadius:10,background:c,cursor:"pointer",border:editForm.color.toLowerCase()===c.toLowerCase()?"2.5px solid #fff":"2.5px solid transparent",transition:"transform .12s",boxShadow:editForm.color.toLowerCase()===c.toLowerCase()?`0 0 10px ${c}77`:"none"}}/>
          ))}
        </div>

        <div style={{background:colorToBg(editForm.color),border:`1.5px solid ${editForm.color}28`,borderRadius:14,padding:"14px 16px",marginBottom:18}}>
          <div style={{fontSize:9,color:"#333",letterSpacing:2.5,textTransform:"uppercase",marginBottom:8}}>Preview</div>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <div style={{fontSize:26}}>{editForm.emoji}</div>
            <div>
              <div style={{fontWeight:700,fontSize:13,color:editForm.color}}>{editForm.name||"Profile Name"}</div>
              <div style={{fontSize:11,color:"#666",fontFamily:"Noto Serif,serif"}}>{editForm.mantra||"Mantra text"}</div>
              <div style={{fontSize:10,color:"#444",marginTop:4}}>Target <span style={{color:lighten(editForm.color),fontWeight:600}}>{editForm.target||108}</span></div>
            </div>
          </div>
        </div>

        <button onClick={saveEdit} style={{width:"100%",padding:15,background:`linear-gradient(135deg,${lighten(editForm.color)},${editForm.color})`,border:"none",borderRadius:13,color:"#fff",fontWeight:800,fontSize:14,letterSpacing:1,boxShadow:`0 8px 28px ${editForm.color}45`}}>
          Save Profile
        </button>

        {editForm._src==="custom"&&editForm.name&&(
          <button onClick={e=>{delCustom(editForm.id,e);setScreen("home");}}
            style={{width:"100%",marginTop:12,padding:14,background:"none",border:"1px solid #2a1010",borderRadius:13,color:"#663333",fontSize:12,fontWeight:500}}>
            🗑 Delete This Profile
          </button>
        )}
      </div>
    </div>
  );

  return null;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>

<!-- PWA Service Worker registration -->
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
